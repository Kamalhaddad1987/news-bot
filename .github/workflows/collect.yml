name: Collect news

on:
  schedule:
    - cron: "*/15 * * * *"     # the bot thins this out outside market hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-bot              # shared with the other workflows so commits never collide
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Collect, score and alert
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot collect ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Save results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet || git commit -m "Update news $(date -u +%H:%M)"
          git pull --rebase --quiet && git push --quiet
